<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شات نبض العرب - النسخة الاحترافية المثالية</title>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>

        :root{
            --primary:#075e54;
            --primary-dark:#054d44;
            --light-green:#e1ffc7;
            --bg-chat:#efe7dd;
            --whatsapp-green:#1fa855;
            --accent-blue:#007bff;
        }

        *{
            box-sizing:border-box;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            margin:0;
            padding:0;
        }

        body{
            background-color:#f0f2f5;
            display:flex;
            flex-direction:column;
            height:100vh;
            max-height:100vh;
            overflow:hidden;
            width:100vw;
        }

        /* =========================================
        تطوير شريط الإرسال
        ========================================= */

        .input-row-wa{
            position:relative;
            display:flex;
            align-items:center;
            gap:8px;
            padding:8px 10px;
            background:rgba(239,231,221,.90);
            backdrop-filter:blur(10px);
            border-top:1px solid rgba(0,0,0,.05);
        }

        .input-bar-wa{
            flex:1;
            display:flex;
            align-items:center;
            background:#fff;
            border-radius:30px;
            padding:0 12px;
            height:50px;
            box-shadow:0 3px 10px rgba(0,0,0,.06);
        }

        .input-box{
            flex:1;
            border:none;
            outline:none;
            background:none;
            font-size:14px;
            padding:0 10px;
            color:#222;
        }

        .input-box::placeholder{
            color:#888;
        }

        /* =========================================
        أزرار حديثة
        ========================================= */

        .wa-modern-btn{
            width:38px;
            height:38px;
            border:none;
            background:none;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            cursor:pointer;
            transition:.2s;
            color:#667781;
            flex-shrink:0;
        }

        .wa-modern-btn:active{
            background:#f1f1f1;
            transform:scale(.92);
        }

        /* =========================================
        زر الإرسال والمايك
        ========================================= */

        .action-circle-btn-wa{
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#075e54;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition:.2s;
            box-shadow:0 3px 12px rgba(0,0,0,.15);
            flex-shrink:0;
        }

        .action-circle-btn-wa:active{
            transform:scale(.93);
        }

        .mic-active-wa{
            background:#d93025 !important;
        }

        /* =========================================
        قائمة المرفقات
        ========================================= */

        .attach-popup-menu{
            position:absolute;
            bottom:68px;
            right:12px;
            background:#ffffff;
            border-radius:20px;
            padding:8px;
            display:none;
            flex-direction:column;
            gap:8px;
            box-shadow:0 8px 25px rgba(0,0,0,.18);
            z-index:99999;
            min-width:180px;
            animation:popupSmooth .18s ease;
        }

        .attach-popup-menu button{
            border:none;
            background:#f7f7f7;
            padding:12px;
            border-radius:14px;
            cursor:pointer;
            font-size:14px;
            text-align:right;
            transition:.2s;
        }

        .attach-popup-menu button:active{
            transform:scale(.97);
            background:#ececec;
        }

        @keyframes popupSmooth{

            from{
                opacity:0;
                transform:translateY(10px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        /* =========================================
        تحسين الرسائل
        ========================================= */

        .bubble{
            animation:msgAppear .16s ease;
        }

        @keyframes msgAppear{

            from{
                opacity:0;
                transform:scale(.96);
            }

            to{
                opacity:1;
                transform:scale(1);
            }
        }

        /* =========================================
        الصور داخل الرسائل
        ========================================= */

        .chat-image-msg{
            width:100%;
            max-width:230px;
            border-radius:12px;
            margin-top:6px;
            cursor:pointer;
        }

        /* =========================================
        الفيديو
        ========================================= */

        .chat-video-msg{
            width:100%;
            max-width:240px;
            border-radius:12px;
            margin-top:6px;
            overflow:hidden;
        }

        .chat-video-msg video{
            width:100%;
            border-radius:12px;
        }

        /* =========================================
        fullscreen image
        ========================================= */

        .fullscreen-image-view{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.95);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999999;
        }

        .fullscreen-image-view img{
            max-width:95%;
            max-height:90%;
            border-radius:12px;
        }

        .close-fullscreen-btn{
            position:absolute;
            top:20px;
            right:20px;
            width:42px;
            height:42px;
            border:none;
            border-radius:50%;
            background:#ffffff;
            font-size:18px;
            cursor:pointer;
        }

    </style>
</head>
<div class="chat-view-container" id="global-chat-window">

    <div class="chat-subheader">
        <span id="current-chat-target-title"
              style="font-weight:bold;color:var(--primary-dark);">
              غرفة المحادثة
        </span>

        <button class="mini-action-btn"
                style="background:#6c757d;"
                onclick="closeChatWindowView()">
                خروج 🔙
        </button>
    </div>

    <div class="messages-area" id="chat-messages-box"></div>

    <!-- معاينة الرد -->
    <div id="reply-preview-container"
         style="display:none;
                background:#ffffff;
                padding:6px 14px;
                font-size:12px;
                border-top:2px solid var(--accent-blue);
                justify-content:space-between;
                align-items:center;
                width:100%;">

        <span id="reply-preview-text"
              style="color:#555;font-weight:500;"></span>

        <button style="border:none;
                       background:none;
                       color:red;
                       font-weight:bold;
                       cursor:pointer;"
                onclick="cancelReplyQuote()">
                ✕
        </button>
    </div>

    <!-- شاشة عرض الصورة -->
    <div class="fullscreen-image-view" id="fullscreenImageView">
        <button class="close-fullscreen-btn"
                onclick="closeFullscreenImage()">
                ✕
        </button>

        <img id="fullscreenImageTag" src="">
    </div>

    <!-- قائمة المرفقات -->
    <div class="attach-popup-menu" id="attachPopupMenu">

        <button onclick="pickGalleryImage()">
            🖼️ إرسال صورة
        </button>

        <button onclick="pickVideoFile()">
            🎥 إرسال فيديو
        </button>

        <button onclick="pickAudioFile()">
            🎵 إرسال مقطع صوتي
        </button>

        <button onclick="shareLocationNow()">
            📍 إرسال الموقع
        </button>

        <button onclick="shareContactCard()">
            👤 إرسال جهة اتصال
        </button>

    </div>

    <!-- الملفات -->
    <input type="file"
           id="modern-image-input"
           accept="image/*"
           style="display:none;">

    <input type="file"
           id="modern-video-input"
           accept="video/*"
           style="display:none;">

    <input type="file"
           id="modern-audio-input"
           accept="audio/*"
           style="display:none;">

    <!-- شريط الإرسال المطور -->
    <div class="input-row-wa">

        <div class="input-bar-wa">

            <!-- دبوس المرفقات -->
            <button class="wa-modern-btn"
                    onclick="toggleAttachMenu()">

                <svg width="22"
                     height="22"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">

                    <path d="M21.44 11.05l-8.49 8.49a5.5 5.5 0 01-7.78-7.78l8.49-8.49a3.5 3.5 0 114.95 4.95l-8.5 8.49a1.5 1.5 0 01-2.12-2.12l7.79-7.78"/>
                </svg>

            </button>

            <!-- حقل الكتابة -->
            <input type="text"
                   class="input-box"
                   id="chat-message-input"
                   placeholder="اكتب رسالة..."
                   oninput="handleInputChangeUI(this)">

            <!-- كاميرا حديثة -->
            <button class="wa-modern-btn"
                    onclick="pickGalleryImage()">

                <svg width="23"
                     height="23"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     viewBox="0 0 24 24">

                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>

                </svg>

            </button>

        </div>

        <!-- زر الإرسال / المايك -->
        <button class="action-circle-btn-wa"
                id="mic-submit-btn">

            <svg id="main-action-icon"
                 width="22"
                 height="22"
                 fill="none"
                 stroke="white"
                 stroke-width="2"
                 viewBox="0 0 24 24">

                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>

            </svg>

        </button>

    </div>

</div>
<script>

/* =========================
تحميل 50 رسالة فقط
========================= */

const MESSAGE_LIMIT = 50;

/* =========================
تغيير أيقونة الإرسال
========================= */

window.handleInputChangeUI = function(input){

    const icon = document.getElementById("main-action-icon");

    if(input.value.trim() !== ""){

        icon.innerHTML = `
            <path d="M22 2L11 13"></path>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        `;

    }else{

        icon.innerHTML = `
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
        `;
    }
};

/* =========================
قائمة الدبوس
========================= */

window.toggleAttachMenu = function(){

    const menu = document.getElementById("attachPopupMenu");

    if(menu.style.display === "flex"){
        menu.style.display = "none";
    }else{
        menu.style.display = "flex";
    }
};

/* =========================
إغلاق القائمة عند الضغط بالخارج
========================= */

document.addEventListener("click",(e)=>{

    const menu = document.getElementById("attachPopupMenu");

    if(
        !e.target.closest("#attachPopupMenu") &&
        !e.target.closest(".wa-modern-btn")
    ){
        menu.style.display = "none";
    }
});

/* =========================
اختيار صورة
========================= */

window.pickGalleryImage = function(){

    document.getElementById("modern-image-input").click();
    document.getElementById("attachPopupMenu").style.display = "none";
};

/* =========================
اختيار فيديو
========================= */

window.pickVideoFile = function(){

    document.getElementById("modern-video-input").click();
    document.getElementById("attachPopupMenu").style.display = "none";
};

/* =========================
اختيار صوت
========================= */

window.pickAudioFile = function(){

    document.getElementById("modern-audio-input").click();
    document.getElementById("attachPopupMenu").style.display = "none";
};

/* =========================
إرسال الموقع
========================= */

window.shareLocationNow = function(){

    document.getElementById("attachPopupMenu").style.display = "none";

    if(!navigator.geolocation){
        return alert("المتصفح لا يدعم الموقع.");
    }

    navigator.geolocation.getCurrentPosition((pos)=>{

        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;

        const locationMessage =
        `📍 موقعي الحالي:\nhttps://maps.google.com/?q=${lat},${lng}`;

        sendCustomMessage(locationMessage);

    },()=>{

        alert("فشل الحصول على الموقع.");
    });
};

/* =========================
إرسال جهة اتصال
========================= */

window.shareContactCard = function(){

    document.getElementById("attachPopupMenu").style.display = "none";

    const name = prompt("اكتب اسم جهة الاتصال:");
    if(!name) return;

    const number = prompt("اكتب رقم الهاتف:");
    if(!number) return;

    const txt =
`👤 جهة اتصال

الاسم: ${name}

📞 الرقم:
${number}`;

    sendCustomMessage(txt);
};

/* =========================
إرسال رسالة مخصصة
========================= */

function sendCustomMessage(text){

    const payload = {
        sender: currentUsername,
        senderAvatar: userAvatar,
        text: text,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        likedBy:[]
    };

    if(isPrivateChat){

        payload.recipient = privateRecipientName;
        payload.isRead = false;

        db.collection("private_chats").add(payload);

    }else if(isGroupChat){

        db.collection("custom_groups")
        .doc(currentRoomId)
        .collection("messages")
        .add(payload);

    }else{

        db.collection("rooms")
        .doc(currentRoomId)
        .collection("messages")
        .add(payload);
    }
}

/* =========================
تحميل الملفات
========================= */

document
.getElementById("modern-image-input")
.addEventListener("change",(e)=>{

    handleModernFile(
        e.target.files[0],
        "image"
    );
});

document
.getElementById("modern-video-input")
.addEventListener("change",(e)=>{

    handleModernFile(
        e.target.files[0],
        "video"
    );
});

document
.getElementById("modern-audio-input")
.addEventListener("change",(e)=>{

    handleModernFile(
        e.target.files[0],
        "audio"
    );
});

/* =========================
معالجة الملفات
========================= */

function handleModernFile(file,type){

    if(!file) return;

    const reader = new FileReader();

    reader.onloadend = ()=>{

        const payload = {

            sender: currentUsername,
            senderAvatar: userAvatar,
            mediaUrl: reader.result,
            mediaType: type,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            likedBy:[]
        };

        if(isPrivateChat){

            payload.recipient = privateRecipientName;
            payload.isRead = false;

            db.collection("private_chats").add(payload);

        }else if(isGroupChat){

            db.collection("custom_groups")
            .doc(currentRoomId)
            .collection("messages")
            .add(payload);

        }else{

            db.collection("rooms")
            .doc(currentRoomId)
            .collection("messages")
            .add(payload);
        }
    };

    reader.readAsDataURL(file);
}

/* =========================
فتح الصورة fullscreen
========================= */

window.openFullscreenImage = function(src){

    document.getElementById("fullscreenImageView").style.display = "flex";

    document.getElementById("fullscreenImageTag").src = src;
};

window.closeFullscreenImage = function(){

    document.getElementById("fullscreenImageView").style.display = "none";
};

/* =========================
تطوير الرسائل
========================= */

function loadMessagesEngine(){

    if(chatUnsubscribe) chatUnsubscribe();

    chatMessagesBox.innerHTML = "";

    let queryRef;

    if(isPrivateChat){

        queryRef = db.collection("private_chats")
        .orderBy("timestamp","desc")
        .limit(MESSAGE_LIMIT);

    }else if(isGroupChat){

        queryRef = db.collection("custom_groups")
        .doc(currentRoomId)
        .collection("messages")
        .orderBy("timestamp","desc")
        .limit(MESSAGE_LIMIT);

    }else{

        queryRef = db.collection("rooms")
        .doc(currentRoomId)
        .collection("messages")
        .orderBy("timestamp","desc")
        .limit(MESSAGE_LIMIT);
    }

    chatUnsubscribe = queryRef.onSnapshot((snapshot)=>{

        chatMessagesBox.innerHTML = "";

        const docs = [];

        snapshot.forEach(doc=>{
            docs.push(doc);
        });

        docs.reverse();

        docs.forEach((doc)=>{

            const data = doc.data();

            const isMe = data.sender === currentUsername;

            const wrapper = document.createElement("div");

            wrapper.className =
            `msg-wrapper ${isMe ? 'me':'other'}`;

            if(!isMe){

                const img = document.createElement("img");

                img.className = "msg-user-img";

                img.src =
                data.senderAvatar ||
                "https://www.w3schools.com/howto/img_avatar.png";

                wrapper.appendChild(img);
            }

            const bubble = document.createElement("div");

            bubble.className = "bubble";

            bubble.style.backgroundColor =
            isMe ? "#e1ffc7" : "#ffffff";

            bubble.style.borderRadius =
            isMe ?
            "12px 0px 12px 12px" :
            "0px 12px 12px 12px";

            bubble.innerHTML += `
                <span class="sender-name">
                    ${isMe ? 'أنا' : data.sender}
                </span>
            `;

            if(data.text){

                bubble.innerHTML += `
                    <div style="margin-top:4px;">
                        ${data.text.replace(/\n/g,"<br>")}
                    </div>
                `;
            }

            if(data.mediaType === "image"){

                bubble.innerHTML += `
                    <img
                    src="${data.mediaUrl}"
                    class="chat-image-msg"
                    onclick="openFullscreenImage('${data.mediaUrl}')">
                `;
            }

            if(data.mediaType === "video"){

                bubble.innerHTML += `
                    <div class="chat-video-msg">
                        <video controls>
                            <source src="${data.mediaUrl}">
                        </video>
                    </div>
                `;
            }

            if(data.mediaType === "audio"){

                bubble.innerHTML += `
                    <audio controls
                           style="margin-top:8px;width:220px;">
                        <source src="${data.mediaUrl}">
                    </audio>
                `;
            }

            bubble.innerHTML += `
                <div class="bubble-footer">

                    <span>
                        ${
                            data.timestamp
                            ?
                            data.timestamp.toDate().toLocaleTimeString(
                                'ar-EG',
                                {
                                    hour:'2-digit',
                                    minute:'2-digit'
                                }
                            )
                            :
                            "الآن"
                        }
                    </span>

                </div>
            `;

            wrapper.appendChild(bubble);

            chatMessagesBox.appendChild(wrapper);
        });

        chatMessagesBox.scrollTop =
        chatMessagesBox.scrollHeight;
    });
}

/* =========================
زر الإرسال / المايك
========================= */

micSubmitBtn.addEventListener("click",()=>{

    if(chatMessageInput.value.trim() !== ""){

        processMessageSend();

    }else{

        toggleVoiceRecordingEngine();
    }
});

            </script>
